<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login</title>
    <link rel="stylesheet" href="../css/auth.css">
    <script type="module" src="../js/index.js"></script>
</head>

<body>
<main class="page">
    <section class="login-panel">
        <div class="login-card">
            <div class="logo-area">
                <div class="logo-box">
                    <img src="../images/pet-erson-orange-logo.svg" alt="Logo da empresa">
                </div>
            </div>

            <header class="login-header">
                <h2 class="login-title">Entrar na conta</h2>
                <p class="login-subtitle">
                    Informe seus dados de acesso para continuar.
                </p>
            </header>

            <form class="form" id="loginForm">
                <div class="form-group" id="emailGroup">
                    <label class="form-label" for="email">E-mail</label>

                    <input
                            class="form-input"
                            id="email"
                            name="email"
                            type="email"
                            placeholder="seu@email.com"
                            autocomplete="email"
                    >

                    <span class="error-message" id="emailError">
                            Informe um e-mail válido.
                        </span>
                </div>

                <div class="form-group" id="passwordGroup">
                    <label class="form-label" for="password">Senha</label>

                    <div class="input-wrapper">
                        <input
                                class="form-input password-input"
                                id="password"
                                name="password"
                                type="password"
                                placeholder="Digite sua senha"
                                autocomplete="current-password"
                        >

                        <button
                                class="password-toggle"
                                type="button"
                                id="passwordToggle"
                                aria-label="Mostrar senha"
                        >
                            Mostrar
                        </button>
                    </div>

                    <span class="error-message" id="passwordError">
                            Informe sua senha.
                        </span>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember">
                        Lembrar-me
                    </label>

                    <a href="#" class="link">Esqueci minha senha</a>
                </div>

                <button class="primary-button" type="submit">
                    Entrar
                </button>
            </form>

            <div class="form-footer">
                Ainda não tem uma conta?
                <a href="./cadastro.html" class="link">Criar conta</a>
            </div>
        </div>
    </section>
    <section class="brand-panel" aria-hidden="true">
        <div class="brand-content">
            <div class="brand-badge">
                <span class="brand-badge-dot"></span>
                Área segura
            </div>

            <h1 class="brand-title">
                Bem-vindo de volta!
            </h1>

            <p class="brand-description">
                Com sua conta Pet Erson, seu pet fica ainda mais feliz 🧡
            </p>
        </div>
    </section>
</main>

<script>
    const form = document.querySelector("#loginForm");
    const emailInput = document.querySelector("#email");
    const passwordInput = document.querySelector("#password");
    const emailGroup = document.querySelector("#emailGroup");
    const passwordGroup = document.querySelector("#passwordGroup");
    const passwordToggle = document.querySelector("#passwordToggle");

    function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function setFieldError(group, hasError) {
        group.classList.toggle("has-error", hasError);
    }

    passwordToggle.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";

        passwordInput.type = isPassword ? "text" : "password";
        passwordToggle.textContent = isPassword ? "Ocultar" : "Mostrar";
        passwordToggle.setAttribute(
            "aria-label",
            isPassword ? "Ocultar senha" : "Mostrar senha"
        );
    });

    form.addEventListener("submit", (event) => {
        event.preventDefault();

        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        const hasEmailError = !isValidEmail(email);
        const hasPasswordError = password.length === 0;

        setFieldError(emailGroup, hasEmailError);
        setFieldError(passwordGroup, hasPasswordError);

        if (hasEmailError || hasPasswordError) {
            return;
        }

            Services.Auth.login(email, password, form.remember.checked);
    });
</script>
</body>
</html>
