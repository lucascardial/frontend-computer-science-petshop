<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login</title>
    <link rel="stylesheet" href="../css/auth.css">
    <script type="module" src="../js/index.js"></script>
</head>

<body>
<main class="page">
    <section class="login-panel">
        <div class="login-card">
            <div class="logo-area">
                <div class="logo-box">
                    <img src="../images/pet-erson-orange-logo.svg" alt="Logo da empresa">
                </div>
            </div>

            <header class="login-header">
                <h2 class="login-title">Entrar na conta</h2>
                <p class="login-subtitle">
                    Informe seus dados de acesso para continuar.
                </p>
            </header>

            <form class="form">
                <div class="form-group" id="emailGroup">
                    <label class="form-label" for="email">E-mail</label>

                    <input
                            class="form-input"
                            id="email"
                            name="email"
                            type="email"
                            placeholder="seu@email.com"
                            autocomplete="email"
                    >

                    <span class="input-error-message"></span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Senha</label>

                    <div class="input-group">
                        <input
                                class="form-input password-input"
                                id="password"
                                name="password"
                                type="password"
                                placeholder="Digite sua senha"
                                autocomplete="current-password"
                        >

                        <button
                                class="password-toggle"
                                type="button"
                                id="passwordToggle"
                                aria-label="Mostrar senha"
                        >
                            Mostrar
                        </button>
                    </div>

                    <span class="input-error-message"></span>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember">
                        Lembrar-me
                    </label>
                </div>

                <button class="primary-button" type="submit">
                    Entrar
                </button>
            </form>

            <div class="form-footer">
                Ainda não tem uma conta?
                <a href="./cadastro.html" class="link">Criar conta</a>
            </div>
        </div>
    </section>
    <section class="brand-panel" aria-hidden="true">
        <div class="brand-content">
            <div class="brand-badge">
                <span class="brand-badge-dot"></span>
                Área segura
            </div>

            <h1 class="brand-title">
                Bem-vindo de volta!
            </h1>

            <p class="brand-description">
                Com sua conta Pet Erson, seu pet fica ainda mais feliz 🧡
            </p>
        </div>
    </section>
</main>

<script type="module">
    import {resetFormErrors} from "../js/form.js";
    import {Helpers} from "../js/helpers.js";
    import {registerFormError} from "../js/form.js";


    window.onload = function() {
        function validateEmail(email) {
            if(!Helpers.isValidEmail(email.value)) {
                registerFormError(email, 'Informe um e-mail válido!')
            }
        }

        function validatePassword(password) {
            if(password.value.trim().length < 6) {
                registerFormError(password, 'A senha deve ter no mínimo 6 caractéres');
            }
        }

        document.querySelector("form").addEventListener("submit", event => {
            event.preventDefault();

            const form = event.target;
            const emailInput = form.email;
            const passwordInput = form.password;

            resetFormErrors(form);
            validateEmail(emailInput)
            validatePassword(passwordInput)

            if(form.querySelector('.form-group.has-error') !== null) {
                return;
            }

            const email = emailInput.value;
            const password = passwordInput.value;

            Services.Auth.login(email, password, form.remember.checked);
        })

        document.querySelector("#passwordToggle").addEventListener("click", (event) => {
            const passwordInput = document.querySelector("#password-input");
            const isPassword = passwordInput.type === "password";

            passwordInput.type = isPassword ? "text" : "password";
            event.target.textContent = isPassword ? "Ocultar" : "Mostrar";
            event.target.setAttribute(
                "aria-label",
                isPassword ? "Ocultar senha" : "Mostrar senha"
            );
        });
    }
</script>
</body>
</html>
