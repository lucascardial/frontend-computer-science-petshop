<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cadastro</title>
    <link rel="stylesheet" href="../css/auth.css">
    <script type="module" src="../js/index.js"></script>
</head>

<body>
<main class="page">
    <section class="login-panel">
        <div class="login-card">
            <div class="logo-area">
                <div class="logo-box">
                    <img src="../images/pet-erson-orange-logo.svg" alt="Logo da empresa">
                </div>
            </div>

            <header class="login-header">
                <h2 class="login-title">Criar conta</h2>
                <p class="login-subtitle">
                    Informe seus dados de acesso para se cadastrar.
                </p>
            </header>

            <form class="form" id="loginForm">
                <div class="form-group" id="nameGroup">
                    <label class="form-label" for="user-name-input">Nome Completo</label>

                    <input
                            class="form-input"
                            id="user-name-input"
                            name="userName"
                            type="text"
                    >

                    <span class="input-error-message"></span>
                </div>
                <div class="form-group" id="emailGroup">
                    <label class="form-label" for="email">E-mail</label>

                    <input
                            class="form-input"
                            id="email"
                            name="email"
                            placeholder="seu@email.com"
                            autocomplete="email"
                    >

                    <span class="input-error-message"></span>
                </div>

                <div class="form-group secret-input">
                    <label class="form-label" for="password-input">Senha</label>

                    <div class="input-group">
                        <input
                                class="form-input password-input"
                                id="password-input"
                                name="password"
                                type="password"
                                placeholder="Digite sua senha"
                                autocomplete="current-password"
                        >

                        <button
                                class="password-toggle"
                                type="button"
                                id="passwordToggle"
                                aria-label="Mostrar senha"
                        >
                            Mostrar
                        </button>
                    </div>

                    <span class="input-error-message"></span>
                </div>

                <button class="primary-button" type="submit">
                    Cadastrar-me
                </button>
            </form>

            <div class="form-footer">
                Já possui uma conta?
                <a href="./login.html" class="link">Fazer login</a>
            </div>
        </div>
    </section>
    <section class="brand-panel" aria-hidden="true">
        <div class="brand-content">
            <h1 class="brand-title">
                Venha fazer parte!
            </h1>

            <p class="brand-description">
                Abra sua conta Pet Erson e transforme a rotina do seu companheiro 🧡
            </p>
        </div>
    </section>
</main>

<script type="module">
    import {User} from "../js/models";
    import {Helpers} from "../js/helpers.js";
    import {resetFormErrors} from "../js/form.js";

    const passwordToggle = document.querySelector("#passwordToggle");

    /**
     * @param {HTMLInputElement} input
     * @param {string} message
     * @return {void}
     */
    function registerFormError(input, message)
    {
        const inputGroup = input.closest('.form-group');

        inputGroup.querySelector('.input-error-message').textContent = message;
        inputGroup.classList.add('has-error');
    }


    /**
     * @param {HTMLInputElement} email
     * @return {boolean}
     */
    function validateEmail(email) {
        if(!Helpers.isValidEmail(email.value)) {
            registerFormError(email, 'Informe um e-mail válido!')
        }
    }

    /**
     * @param {HTMLInputElement} name
     * @return {void}
     */
    function validadeName(name) {
        const nameCount = name.value.trim().split(' ').length;

        if(name.value.trim().length === 0) {
            registerFormError(name, 'Campo obrigatório!')
            return;
        }

        if(nameCount < 2) {
            registerFormError(name, 'O sobrenome é obrigatório')
        }
    }

    function validatePassword(password) {
        if(password.value.trim().length < 6) {
            registerFormError(password, 'A senha deve ter no mínimo 6 caractéres');
        }
    }

    // passwordToggle.addEventListener("click", () => {
    //     const passwordInput = document.querySelector("#password-input");
    //     const isPassword = passwordInput.type === "password";
    //
    //     passwordInput.type = isPassword ? "text" : "password";
    //     passwordToggle.textContent = isPassword ? "Ocultar" : "Mostrar";
    //     passwordToggle.setAttribute(
    //         "aria-label",
    //         isPassword ? "Ocultar senha" : "Mostrar senha"
    //     );
    // });

    function handleSignup(event) {
        event.preventDefault();
        const form = event.target;
        const nameInput = form.userName;
        const emailInput = form.email;
        const passwordInput = form.password;

        resetFormErrors(form);

        validateEmail(emailInput);
        validadeName(nameInput);
        validatePassword(passwordInput);

        if(form.querySelector('.form-group.has-error') !== null) {
            return;
        }

        const email = form.email.value;
        const name = form.userName.value;
        const password = form.password.value.trim();


        Services.Auth.signup(new User({
            name: name,
            email: email,
            password: password
        }))

        Services.Auth.login(email, password)
    }

    window.onload = function() {
        document.querySelector("#loginForm").addEventListener("submit", handleSignup);
    }
</script>
</body>
</html>
