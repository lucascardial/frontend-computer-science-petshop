<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../js/index.js">
    </script>
    <script>
        function cadastroUsuario(event){
            event.preventDefault();
            const form = event.target;
            const nome = form.nome.value;
            const cpf = form.cpf.value;
            const telefone = form.telefone.value;
            const email = form.email.value;
            const senha = form.senha.value;
            console.log(`nome do cliente: ${nome}`);
            console.log(`cpf do cliente: ${cpf}`);
            console.log(`telefone do cliente: ${telefone}`);
            console.log(`email do cliente: ${email}`);
            console.log(`senha do cliente: ${senha}`);

            Repositories.User.salvarUsuario(new Models.User({
                name: nome,
                email: email,
                password: senha,
                cpf: cpf,
                phoneNumber: telefone,
            }))
        }
    </script>
</head>
<body>
    
<h1>Cadastro de Usuário</h1>

<form onsubmit="cadastroUsuario(event)">
<section id="clientes">
<label>Nome Completo:</label><br />
<input type="text" name="nome" required /><br /><br />
<label>CPF:</label><br />
<input type="text" name="cpf" required /><br /><br />
<label>Telefone:</label><br />
<input type="tel" name="telefone" required /><br /><br />
<label>E-mail:</label><br />
<input type="email" name="email" required /><br /><br />
<label>Senha:</label><br />
<input type="text" name="senha" required /><br /><br />
</section>

<button type="submit">Cadastrar</button>
</form>

</body>
</html>
