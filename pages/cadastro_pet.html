<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function cadastroPet(event){
            event.preventDefault();
            const form = event.target;
            const nome_pet = form.nome_pet.value;
            const especie = form.especie.value;
            const raca = form.raca.value;
            const idade = form.idade.value;
            const peso = form.peso.value;
            const dono = form.dono.value;  
            console.log(`nome do pet: ${nome_pet}`);
            console.log(`especie: ${especie}`);
            console.log(`raca: ${raca}`);
            console.log(`idade: ${idade}`);
            console.log(`peso: ${peso}`);
            console.log(`dono: ${dono}`);
        }
    </script>
</head>
<body>
<form onsubmit="cadastroPet(event)">
    <section id="pets">
<h2>Cadastro de Pets</h2>

<label>Nome do Pet:</label><br />
<input type="text" name="nome_pet" required /><br /><br />
<label>Espécie:</label><br />
<select name="especie" required>
<option value="">Selecione</option>
<option>Cachorro</option>
<option>Gato</option>
<option>Pássaro</option>
<option>Outro</option></select
><br /><br />

<label>Raça:</label><br />
<input type="text" name="raca" required /><br /><br />

<label>Idade:</label><br />
<input type="number" name="idade" required /><br /><br />

<label>Peso:</label><br />
<input type="text" name="peso" required /><br /><br />

<label>Nome do Dono:</label><br />
<input type="text" name="dono" required /><br /><br />
</section>

<hr />

<button type="submit">Cadastrar</button>
</form>
</body>
</html>
