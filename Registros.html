<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Página base</title>
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>
<dialog id="myDialog" class="dialog-form">
    <form>
            <h2>Novo {Nome do Recurso}</h2>

            <div class="input-group">
                <label for="name-input">Nome</label>
                <input id="name-input" type="text" name="nome" required />
            </div>

            <div class="input-group">
                <label for="specie-option">Exemplo</label>
                <select id="specie-option" name="specie" required>
                    <option value="" disabled selected hidden>Selecione</option>
                    <option value="1">1</option>
                    <option value="1">2</option>
                    <option value="1">3</option>
                </select>
            </div>

            <div class="input-group">
            <label for="content-input">Conteúdo:</label>
            <input id="content-input" type="text" name="contend" required />
            </div>

        <div class="dialog-form-action">
            <button class="btn btn-danger"  type="button" onclick="window.myDialog.close()">Cancelar</button>
            <button class="btn" type="submit">Cadastrar</button>
        </div>
    </form>
    <!-- Botão para FECHAR o diálogo -->
</dialog>
<div id="content">
    <nav class="crumbs">
        <ul>
            <li class="crumb"><a href="#">Início</a></li>
            <li class="crumb"><a href="#">Perfil</a></li>
            <li class="crumb"><a href="#">Configurações</a></li>
        </ul>
    </nav>
    <main>
        <div class="dashboard-header">
            <h1>Título Base</h1>
            <button class="btn" onclick="window.myDialog.showModal()">NOVO</button>
        </div>


        <table>
            <thead>
                <th>ID</th>
                <th>Nome</th>
                <th>Dado Adicional</th>
            </thead>
            <tbody>
            <tr>
                <td>1</td>
                <td>Ou Seja</td>
                <td>Autism</td>
            </tr>
            </tbody>
        </table>
        <!-- Botão para ABRIR o diálogo -->
    </main>
</div>

</body>
</html>
