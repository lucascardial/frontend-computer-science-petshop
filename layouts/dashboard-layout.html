<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link rel="stylesheet" href="../css/input.css">
    <link rel="stylesheet" href="../css/icons.css">
    <script type="module" src="../js/index.js"></script>
    <style>
        .hidden {
            display: none !important;
        }
        .app {
            min-height: 100dvh;
            display: flex;
            gap: 20px;
            padding: 20px;
            overflow: hidden;
        }

        a {
            text-decoration: none;
        }

        a:visited {
            color: inherit;
        }

        aside {
            padding: 30px;
            background: #f7f7f7;
            flex: 1;
            border-radius: 15px;
            overflow: hidden;
            position: fixed;
        }

        aside nav {
            margin-top: 120px;
        }


        .nav-group {
            display: grid;
            margin-top: 20px;
        }

        .nav-group-title {
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .nav-group-item {
            position: relative;
            display: grid;
            grid-template-columns: 30px 1fr;
            grid-gap: 25px;
            align-items: center;
            padding-bottom: 5px;
        }

        .nav-group-item.current-link::before {
            content: '';
            position: absolute;
            top: calc(50% - 10px);
            left: -40px;
            width: 20px;
            height: 20px;
            background: var(--color-primary);
            transform: rotate(45deg);
        }

        .nav-group-item:hover > .nav-icon {
            background: var(--color-primary);
        }

        main {
            flex: 5;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-left: 250px;
        }

        .user-header-section {
            height: 80px;
            background: #f7f7f7;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: end;
            padding: 0 20px;
        }

        .main-content{
            height: 100%;
            background: #f7f7f7;
            border-radius: 15px;
            padding: 0 20px;
        }

        #user-detail {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: relative;
        }

        #user-detail:hover > #user-session-actions {
            display: block;
        }

        #user-detail-picture {
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--color-primary);
            border-radius: 50px;
            color: #fff;
        }

        #user-header-detail-name {
            color: var(--color-text)
        }

        #user-session-actions {
            display: none;
            position: absolute;
            top: 60px;
            right: -20px;
            background-color: #f7f7f7;
            padding: 10px;
            width: 250px;
            box-shadow: #00000052 0 0 24px;
            min-height: 300px;
        }

        #user-session-actions::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            background: #f7f7f7;
            right: 46px;
            top: -7px;
            transform: rotate(45deg);
        }

        #user-session-actions::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 30px;
            top: -18px;
            left: 0;
        }



        #user-header-detail-email {
            color: var(--color-muted);
            font-weight: lighter;
            font-size: 14px;
        }

        .user-header-section p {
            margin: 0;
            padding: 0;
        }

        .centered {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
<div class="app">
    <aside>
        <div class="centered">
            <img src="../images/pet-erson-orange-logo-horizontal.svg" alt="pet-erson-orange-logo" width="165px">
        </div>
        <nav>
            <div class="nav-group">
                <span class="nav-group-title">Geral</span>
                <a href="#" class="nav-group-item current-link">
                    <div class="nav-icon icon-adjustments-horizontal"></div>
                    <span>Dashboard</span>
                </a>
            </div>

            <div class="nav-group">
                <span class="nav-group-title">Pets</span>
                <a href="#" class="nav-group-item">
                    <div class="nav-icon icon-paw"></div>
                    <span>Meus Pets</span>
                </a>
            </div>

            <div class="nav-group">
                <span class="nav-group-title">Atividades</span>
                <a href="#" class="nav-group-item">
                    <div class="nav-icon icon-store"></div>
                    <span>Meus Pedidos</span>
                </a>
                <a href="#" class="nav-group-item">
                    <div class="nav-icon icon-adjustments-horizontal"></div>
                    <span>Meus Serviços</span>
                </a>
            </div>
        </nav>
    </aside>

    <main>
        <div class="user-header-section">
            <div id="user-detail" class="hidden">
                <div id="user-detail-picture">LC</div>
                <span>
                    <p id="user-header-detail-name"></p>
                    <span id="user-header-detail-email"></span>
                </span>
                <div id="user-session-actions">
                    <button onclick="Services.Auth.logout()">Sair</button>
                </div>
            </div>
        </div>
        <div class="main-content">
                <h1>Meus Pets</h1>
        </div>
    </main>
</div>
<script>
    window.onload = () => {
        function redirectToLogin() {
            window.location.href = "./../pages/login.html";
        }

        function setUserSessionInfo() {
            document.querySelector('#user-detail').classList.remove('hidden');
            const user = Services.Auth.getAuthenticatedUser();

            const nameInitials = user.name.split(' ');

            document.querySelector('#user-detail-picture').textContent = `${nameInitials[0][0]}${nameInitials[1][0]}`;
            document.querySelector('#user-header-detail-email').textContent = user.email;
            document.querySelector('#user-header-detail-name').textContent = user.name;
        }

        function checkAuthStatus() {
            if(! Services.Auth.isAuthenticated()) {
                redirectToLogin();
            }
        }

        checkAuthStatus();
        setUserSessionInfo();

        window.addEventListener("userLoggedOut", redirectToLogin);
    }
</script>
</body>
</html>
