<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Página com Menu Lateral</title>
</head>

<body>

    <table border="1" width="100%" height="600">

        <tr>
            <td width="20%" valign="top">

                <h2>Menu</h2>

                <ul>
                    <li><a href="#">Início</a></li>
                    <li><a href="#">Perfil</a></li>
                    <li><a href="#">Configurações</a></li>
                    <li><a href="#">Sair</a></li>
                </ul>

            </td>

            <td>

                <form>
                    <fieldset>
                        <legend>Selecione os serviços</legend>

                        <ul>
                        <li>
                            <input type="checkbox" name="servico" id="banho" value="banho">
                            <label for="banho">Banho</label>
                        </li>

                        <li>
                            <input type="checkbox" name="servico" id="tosa" value="tosa">
                            <label for="tosa">Tosa</label>
                        </li>

                        <li>
                            <input type="checkbox" name="servico" id="vacinacao" value="vacinacao">
                            <label for="vacinacao">Vacinação</label>
                        </li>

                        <li>
                            <input type="checkbox" name="servico" id="consulta" value="consulta">
                            <label for="consulta">Consulta</label>
                        </li>

                        <li>
                            <input type="checkbox" name="servico" id="castracao" value="castracao">
                            <label for="castracao">Castração</label>
                        </li>

                        <li>
                            <input type="checkbox" name="servico" id="hidratacao" value="hidratacao">
                            <label for="hidratacao">Hidratação</label>
                        </li>
                        </ul>
                    </fieldset>

                    <button type="submit">Agendar</button>
                </form>

            </td>

        </tr>
        
    </table>

</body>
</html>
