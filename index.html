<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module" src="js/index.js"></script>
    <style>
        table,
        th,
        td {
            border: 1px solid black;
        }
    </style>
</head>

<body>
    <form id="cadastro-usuario-form">
        <input type="text" name="name" placeholder="Nome Completo" />
        <input type="email" name="email" placeholder="E-mail" />
        <input type="password" name="password" placeholder="Senha" />

        <input type="submit" value="Cadastrar" />
    </form>
    <br />
    <br />
    <br />
    <div id="lista-usuarios"></div>
    <script>
        function cadastraUsuario(event) {
            event.preventDefault();
            const form = event.target;
            const userName = form.name.value;
            const userEmail = form.email.value;
            const password = form.password.value;

            Repositories.User.salvarUsuario(new Models.User({
                name: userName,
                email: userEmail,
                password: password,
            }))

            listarUsuarios();
        }

        function deletaUsuario(id) {
            Repositories.User.deletarUsuario(id)
            listarUsuarios();
        }

        function listarUsuarios() {
            const usuarios = Repositories.User.listarUsuarios()
            let html = `<h3>Sem usuários cadastrados</h1>`;

            if (usuarios.length > 0) {
                html = `
                <table id="lista-usuarios">
                    <thead>
                        <tr>
                        <th>Id</th>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Ação</th>
                        </tr>
                   </thead>`

                for (let usuario of usuarios) {
                    html += `
                     <tr>
                        <td>${usuario.id}</td>
                        <td>${usuario.name}</td>
                        <td>${usuario.email}</td>
                        <td><button onclick="deletaUsuario('${usuario.id}')">Excluir</button></td>
                    </tr>`
                }

                html += `</table>`
            }



            document.getElementById('lista-usuarios').innerHTML = html
        }

        window.onload = function () {
            listarUsuarios()

            document.querySelector('#cadastro-usuario-form').addEventListener('submit', cadastraUsuario)
        };
    </script>
</body>

</html>
