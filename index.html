<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="js/index.js"></script>
    <style>
        table, th, td {
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <form id="cadastro-usuario-form">
        <input type="text" name="name" placeholder="Nome Completo"/> <br><br>
        <input type="email" name="email" placeholder="E-mail"/> <br><br>
        <input type="password" name="password" placeholder="Senha"/> <br><br>
        <input type="text" name="cpf" placeholder="CPF"/> <br><br>
        <input type="text" name="phone" placeholder="Telefone"/> <br><br>

        <input type="submit" value="Cadastrar"/>
    </form>
    <br />
    <br />
    <br />
    <div id="lista-usuarios"></div>
    <script type="module">
        import { User} from "./js/models/index.js";

        function cadastraUsuario(event) {
            event.preventDefault();

            const form = event.target;

            const userName = form.name.value;
            const userEmail = form.email.value;
            const password = form.password.value;
            const cpf = form.cpf.value;
            const phoneNumber = form.phone.value;

            Repositories.User.salvarUsuario(new User({
                name: userName,
                email: userEmail,
                password: password,
                cpf: cpf,
                phoneNumber: phoneNumber,
            }))

            listarUsuarios();
        }

        function deletaUsuario(id) {
            Repositories.User.deletarUsuario(id)
            listarUsuarios();
        }

        function listarUsuarios() {
            const usuarios = Repositories.User.listarUsuarios();

            let doceDeCoco = `<h3>Sem usuários cadastrados</h1>`;

            if(usuarios.length > 0){
                doceDeCoco = `
                <table id="lista-usuarios">
                    <thead>
                        <tr>
                        <th>Id</th>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>CPF</th>
                        <th>Telefone</th>
                        <th>Ação</th>
                        </tr>
                   </thead>`

                for (let usuario of usuarios) {
                    doceDeCoco += `
                       <tr>
                        <td>${usuario.id}</td>
                        <td>${usuario.name}</td>
                        <td>${usuario.email}</td>
                        <td>${usuario.cpf}</td>
                        <td>${usuario.phoneNumber}</td>
                        <td><button onclick="deletaUsuario('${usuario.id}')">Excluir</button></td>
                    </tr>`
                }

                doceDeCoco += `</table>`
            }



            document.getElementById('lista-usuarios').innerHTML = doceDeCoco
        }


        window.onload = function() {
            listarUsuarios()

            const form = document.querySelector('#cadastro-usuario-form');

            form.addEventListener('submit', cadastraUsuario)
        };
    </script>
</body>
</html>
